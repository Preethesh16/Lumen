<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1400 990">
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b172a"/>
      <stop offset="0.62" stop-color="#102f46"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 38px "DejaVu Sans", sans-serif; letter-spacing: 1px; fill: #ffffff; }
      .subtitle { font: 400 16px "DejaVu Sans", sans-serif; fill: #c8e4e2; }
      .meta { font: 600 13px "DejaVu Sans", sans-serif; fill: #d8e7f0; }
      .tagline { font: 600 14px "DejaVu Sans", sans-serif; fill: #334155; }
      .card { fill: #ffffff; stroke: #b8c7d5; stroke-width: 1.4; filter: url(#shadow); }
      .card-head { fill: #e9f5f4; }
      .card-head-blue { fill: #edf3fb; }
      .card-head-coral { fill: #fff0eb; }
      .card-title { font: 700 15px "DejaVu Sans", sans-serif; letter-spacing: .4px; fill: #102a43; }
      .card-label { font: 700 11px "DejaVu Sans", sans-serif; letter-spacing: .7px; fill: #0f766e; }
      .body { font: 400 12.2px "DejaVu Sans", sans-serif; fill: #243b53; }
      .body-strong { font: 700 12.2px "DejaVu Sans", sans-serif; fill: #102a43; }
      .small { font: 400 10.8px "DejaVu Sans", sans-serif; fill: #486581; }
      .quote { font: 700 17px "DejaVu Sans", sans-serif; fill: #0b3b50; }
      .quote-accent { font: 700 13px "DejaVu Sans", sans-serif; fill: #0f766e; }
      .num { font: 700 11px "DejaVu Sans", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .divider { stroke: #d6e1ea; stroke-width: 1.2; }
      .bullet { fill: #14b8a6; }
      .bullet-coral { fill: #f97360; }
      .pill { fill: #d9efec; }
      .pill-text { font: 700 10.5px "DejaVu Sans", sans-serif; fill: #0f766e; }
      .footer { font: 600 10.5px "DejaVu Sans", sans-serif; fill: #526b7a; }
    </style>
  </defs>

  <rect width="1400" height="990" fill="#f3f7fa"/>
  <rect width="1400" height="116" fill="url(#headerGradient)"/>
  <circle cx="62" cy="58" r="31" fill="#14b8a6"/>
  <path d="M45 76V38h8v30h21v8z M60 38h8l12 25V38h8v38h-8L68 51v25h-8z" fill="#ffffff" opacity="0.96"/>
  <text x="108" y="53" class="title">LUMEN</text>
  <text x="110" y="79" class="subtitle">Lean Canvas · Humanitarian Attention-Gap Intelligence</text>
  <text x="1360" y="45" text-anchor="end" class="meta">IBM SkillsBuild Project</text>
  <text x="1360" y="68" text-anchor="end" class="meta">Preethesh · Deepthi</text>
  <text x="1360" y="91" text-anchor="end" class="meta">July 2026</text>

  <text x="38" y="140" class="tagline">Purpose: reveal crises where human need is high but public attention is low—and turn evidence into action.</text>
  <rect x="1184" y="124" width="178" height="23" rx="11.5" fill="#d9efec"/>
  <text x="1273" y="140" text-anchor="middle" class="pill-text">SDG 10 · SDG 16 · SDG 17</text>

  <!-- 1 Problem -->
  <rect x="36" y="150" width="266" height="580" rx="8" class="card"/>
  <rect x="36" y="150" width="266" height="38" rx="8" class="card-head-coral"/>
  <rect x="36" y="180" width="266" height="8" fill="#fff0eb"/>
  <circle cx="57" cy="169" r="11" fill="#f97360"/><text x="57" y="170" class="num">1</text>
  <text x="77" y="175" class="card-title">PROBLEM</text>

  <circle cx="53" cy="213" r="4" class="bullet-coral"/>
  <text x="65" y="211" class="body-strong">
    <tspan x="65" dy="0">High-need crises can remain</tspan>
    <tspan x="65" dy="17">nearly invisible when media</tspan>
    <tspan x="65" dy="17">coverage is disproportionate.</tspan>
  </text>
  <circle cx="53" cy="282" r="4" class="bullet-coral"/>
  <text x="65" y="280" class="body">
    <tspan x="65" dy="0">Journalists and NGOs manually</tspan>
    <tspan x="65" dy="17">reconcile fragmented, rate-limited</tspan>
    <tspan x="65" dy="17">humanitarian datasets.</tspan>
  </text>
  <circle cx="53" cy="349" r="4" class="bullet-coral"/>
  <text x="65" y="347" class="body">
    <tspan x="65" dy="0">Slow discovery delays reporting,</tspan>
    <tspan x="65" dy="17">advocacy and funding attention.</tspan>
  </text>

  <line x1="50" y1="565" x2="288" y2="565" class="divider"/>
  <text x="52" y="589" class="card-label">EXISTING ALTERNATIVES</text>
  <circle cx="55" cy="615" r="3.5" class="bullet"/><text x="66" y="619" class="small">ReliefWeb / OCHA dashboards</text>
  <circle cx="55" cy="640" r="3.5" class="bullet"/><text x="66" y="644" class="small">Manual spreadsheet research</text>
  <circle cx="55" cy="665" r="3.5" class="bullet"/>
  <text x="66" y="663" class="small">
    <tspan x="66" dy="0">Generic news alerts and</tspan>
    <tspan x="66" dy="15">ungrounded AI summaries</tspan>
  </text>

  <!-- 2 Solution -->
  <rect x="302" y="150" width="266" height="290" rx="8" class="card"/>
  <rect x="302" y="150" width="266" height="38" rx="8" class="card-head"/>
  <rect x="302" y="180" width="266" height="8" fill="#e9f5f4"/>
  <circle cx="323" cy="169" r="11" fill="#0f766e"/><text x="323" y="170" class="num">2</text>
  <text x="343" y="175" class="card-title">SOLUTION</text>
  <circle cx="320" cy="215" r="4" class="bullet"/><text x="332" y="219" class="body">Daily multi-source ingestion</text>
  <circle cx="320" cy="248" r="4" class="bullet"/>
  <text x="332" y="246" class="body">
    <tspan x="332" dy="0">Transparent attention-gap</tspan>
    <tspan x="332" dy="17">ranking and evidence trail</tspan>
  </text>
  <circle cx="320" cy="298" r="4" class="bullet"/>
  <text x="332" y="296" class="body">
    <tspan x="332" dy="0">Grounded, audience-specific</tspan>
    <tspan x="332" dy="17">brief generation</tspan>
  </text>
  <circle cx="320" cy="348" r="4" class="bullet"/>
  <text x="332" y="346" class="body">
    <tspan x="332" dy="0">Dashboard + Telegram + email</tspan>
    <tspan x="332" dy="17">delivery in one workflow</tspan>
  </text>
  <rect x="320" y="393" width="173" height="25" rx="12.5" class="pill"/>
  <text x="334" y="410" class="pill-text">26 initial crises monitored</text>

  <!-- 8 Key Metrics -->
  <rect x="302" y="440" width="266" height="290" rx="8" class="card"/>
  <rect x="302" y="440" width="266" height="38" rx="8" class="card-head-blue"/>
  <rect x="302" y="470" width="266" height="8" fill="#edf3fb"/>
  <circle cx="323" cy="459" r="11" fill="#3b82b4"/><text x="323" y="460" class="num">8</text>
  <text x="343" y="465" class="card-title">KEY METRICS</text>
  <circle cx="320" cy="505" r="4" class="bullet"/><text x="332" y="509" class="body">Source freshness &amp; success rate</text>
  <circle cx="320" cy="541" r="4" class="bullet"/>
  <text x="332" y="539" class="body">
    <tspan x="332" dy="0">Crises scored and ranking</tspan>
    <tspan x="332" dy="17">coverage</tspan>
  </text>
  <circle cx="320" cy="591" r="4" class="bullet"/>
  <text x="332" y="589" class="body">
    <tspan x="332" dy="0">Brief generation and delivery</tspan>
    <tspan x="332" dy="17">success rate</tspan>
  </text>
  <circle cx="320" cy="641" r="4" class="bullet"/>
  <text x="332" y="639" class="body">
    <tspan x="332" dy="0">Active users, brief shares and</tspan>
    <tspan x="332" dy="17">downstream actions</tspan>
  </text>
  <circle cx="320" cy="691" r="4" class="bullet"/><text x="332" y="695" class="body">Data-to-brief turnaround time</text>

  <!-- 3 Unique Value Proposition -->
  <rect x="568" y="150" width="266" height="580" rx="8" class="card"/>
  <rect x="568" y="150" width="266" height="38" rx="8" class="card-head"/>
  <rect x="568" y="180" width="266" height="8" fill="#e9f5f4"/>
  <circle cx="589" cy="169" r="11" fill="#0f766e"/><text x="589" y="170" class="num">3</text>
  <text x="609" y="175" class="card-title">UNIQUE VALUE PROPOSITION</text>
  <text x="590" y="225" class="quote">
    <tspan x="590" dy="0">Lumen reveals where</tspan>
    <tspan x="590" dy="23">humanitarian need is</tspan>
    <tspan x="590" dy="23">high but attention is low—</tspan>
    <tspan x="590" dy="23">then turns the evidence</tspan>
    <tspan x="590" dy="23">into a</tspan>
    <tspan x="590" dy="23">ready-to-share brief.</tspan>
  </text>
  <text x="590" y="373" class="quote-accent">
    <tspan x="590" dy="0">One clear ranking.</tspan>
    <tspan x="590" dy="20">Traceable facts.</tspan>
    <tspan x="590" dy="20">Immediate outreach.</tspan>
  </text>
  <rect x="590" y="455" width="218" height="70" rx="8" fill="#f0f9f8" stroke="#99d5cf"/>
  <text x="699" y="478" text-anchor="middle" class="small">Designed for action—not just</text>
  <text x="699" y="495" text-anchor="middle" class="small">another data dashboard.</text>
  <text x="699" y="512" text-anchor="middle" class="small">Works even if the AI provider fails.</text>

  <line x1="584" y1="565" x2="818" y2="565" class="divider"/>
  <text x="588" y="589" class="card-label">HIGH-LEVEL CONCEPT</text>
  <text x="588" y="627" class="body-strong">
    <tspan x="588" dy="0">“An attention-gap radar for</tspan>
    <tspan x="588" dy="20">humanitarian crises.”</tspan>
  </text>
  <text x="588" y="685" class="small">
    <tspan x="588" dy="0">Like a crisis early-warning system,</tspan>
    <tspan x="588" dy="15">focused on neglected attention.</tspan>
  </text>

  <!-- 4 Unfair Advantage -->
  <rect x="834" y="150" width="266" height="290" rx="8" class="card"/>
  <rect x="834" y="150" width="266" height="38" rx="8" class="card-head-blue"/>
  <rect x="834" y="180" width="266" height="8" fill="#edf3fb"/>
  <circle cx="855" cy="169" r="11" fill="#3b82b4"/><text x="855" y="170" class="num">4</text>
  <text x="875" y="175" class="card-title">UNFAIR ADVANTAGE</text>
  <circle cx="852" cy="215" r="4" class="bullet"/>
  <text x="864" y="213" class="body">
    <tspan x="864" dy="0">Compounding historical score</tspan>
    <tspan x="864" dy="17">and raw-evidence dataset</tspan>
  </text>
  <circle cx="852" cy="265" r="4" class="bullet"/>
  <text x="864" y="263" class="body">
    <tspan x="864" dy="0">Auditable, versioned scoring</tspan>
    <tspan x="864" dy="17">instead of opaque ranking</tspan>
  </text>
  <circle cx="852" cy="315" r="4" class="bullet"/>
  <text x="864" y="313" class="body">
    <tspan x="864" dy="0">Source-specific adapters with</tspan>
    <tspan x="864" dy="17">graceful degradation</tspan>
  </text>
  <circle cx="852" cy="365" r="4" class="bullet"/>
  <text x="864" y="363" class="body">
    <tspan x="864" dy="0">Proven end-to-end delivery loop,</tspan>
    <tspan x="864" dy="17">not a static prototype</tspan>
  </text>

  <!-- 5 Channels -->
  <rect x="834" y="440" width="266" height="290" rx="8" class="card"/>
  <rect x="834" y="440" width="266" height="38" rx="8" class="card-head"/>
  <rect x="834" y="470" width="266" height="8" fill="#e9f5f4"/>
  <circle cx="855" cy="459" r="11" fill="#0f766e"/><text x="855" y="460" class="num">5</text>
  <text x="875" y="465" class="card-title">CHANNELS</text>
  <circle cx="852" cy="505" r="4" class="bullet"/><text x="864" y="509" class="body">Public web dashboard</text>
  <circle cx="852" cy="540" r="4" class="bullet"/><text x="864" y="544" class="body">Telegram bot and daily briefs</text>
  <circle cx="852" cy="575" r="4" class="bullet"/><text x="864" y="579" class="body">Email digest and alerts</text>
  <circle cx="852" cy="610" r="4" class="bullet"/>
  <text x="864" y="608" class="body">
    <tspan x="864" dy="0">Direct demos and outreach to</tspan>
    <tspan x="864" dy="17">newsrooms and NGOs</tspan>
  </text>
  <circle cx="852" cy="660" r="4" class="bullet"/>
  <text x="864" y="658" class="body">
    <tspan x="864" dy="0">Journalism schools and</tspan>
    <tspan x="864" dy="17">humanitarian networks</tspan>
  </text>

  <!-- 6 Customer Segments -->
  <rect x="1100" y="150" width="264" height="580" rx="8" class="card"/>
  <rect x="1100" y="150" width="264" height="38" rx="8" class="card-head-coral"/>
  <rect x="1100" y="180" width="264" height="8" fill="#fff0eb"/>
  <circle cx="1121" cy="169" r="11" fill="#f97360"/><text x="1121" y="170" class="num">6</text>
  <text x="1141" y="175" class="card-title">CUSTOMER SEGMENTS</text>
  <text x="1118" y="216" class="card-label">PRIMARY USERS</text>
  <circle cx="1118" cy="242" r="4" class="bullet-coral"/>
  <text x="1130" y="240" class="body">
    <tspan x="1130" dy="0">Journalists, editors and</tspan>
    <tspan x="1130" dy="17">newsroom researchers</tspan>
  </text>
  <circle cx="1118" cy="292" r="4" class="bullet-coral"/>
  <text x="1130" y="290" class="body">
    <tspan x="1130" dy="0">NGO / UN humanitarian and</tspan>
    <tspan x="1130" dy="17">advocacy analysts</tspan>
  </text>
  <circle cx="1118" cy="342" r="4" class="bullet-coral"/>
  <text x="1130" y="340" class="body">
    <tspan x="1130" dy="0">Donor, policy and grantmaking</tspan>
    <tspan x="1130" dy="17">teams</tspan>
  </text>

  <line x1="1114" y1="565" x2="1350" y2="565" class="divider"/>
  <text x="1118" y="589" class="card-label">EARLY ADOPTERS</text>
  <circle cx="1118" cy="616" r="3.5" class="bullet"/>
  <text x="1130" y="614" class="small">
    <tspan x="1130" dy="0">Small global-affairs newsrooms</tspan>
    <tspan x="1130" dy="15">and independent journalists</tspan>
  </text>
  <circle cx="1118" cy="656" r="3.5" class="bullet"/>
  <text x="1130" y="654" class="small">
    <tspan x="1130" dy="0">University journalism and</tspan>
    <tspan x="1130" dy="15">humanitarian labs</tspan>
  </text>
  <circle cx="1118" cy="696" r="3.5" class="bullet"/>
  <text x="1130" y="694" class="small">
    <tspan x="1130" dy="0">Crisis-monitoring and NGO</tspan>
    <tspan x="1130" dy="15">communications teams</tspan>
  </text>

  <!-- 7 Cost Structure -->
  <rect x="36" y="730" width="664" height="210" rx="8" class="card"/>
  <rect x="36" y="730" width="664" height="38" rx="8" class="card-head-blue"/>
  <rect x="36" y="760" width="664" height="8" fill="#edf3fb"/>
  <circle cx="57" cy="749" r="11" fill="#3b82b4"/><text x="57" y="750" class="num">7</text>
  <text x="77" y="755" class="card-title">COST STRUCTURE</text>
  <circle cx="56" cy="794" r="4" class="bullet"/><text x="68" y="798" class="body">Cloud hosting and storage (~$24/month for the current deployment)</text>
  <circle cx="56" cy="828" r="4" class="bullet"/><text x="68" y="832" class="body">Groq / Resend usage beyond free tiers; domain and monitoring</text>
  <circle cx="56" cy="862" r="4" class="bullet"/><text x="68" y="866" class="body">Engineering maintenance, security updates and upstream API monitoring</text>
  <circle cx="56" cy="896" r="4" class="bullet"/><text x="68" y="900" class="body">User research, newsroom/NGO onboarding and partnership outreach</text>

  <!-- 9 Revenue Streams -->
  <rect x="700" y="730" width="664" height="210" rx="8" class="card"/>
  <rect x="700" y="730" width="664" height="38" rx="8" class="card-head"/>
  <rect x="700" y="760" width="664" height="8" fill="#e9f5f4"/>
  <circle cx="721" cy="749" r="11" fill="#0f766e"/><text x="721" y="750" class="num">9</text>
  <text x="741" y="755" class="card-title">REVENUE STREAMS / SUSTAINABILITY</text>
  <circle cx="720" cy="794" r="4" class="bullet"/><text x="732" y="798" class="body">Free public dashboard to maximize humanitarian visibility and trust</text>
  <circle cx="720" cy="828" r="4" class="bullet"/><text x="732" y="832" class="body">Team subscriptions for custom alerts, exports and historical analytics</text>
  <circle cx="720" cy="862" r="4" class="bullet"/><text x="732" y="866" class="body">Institutional licensing / API access for newsrooms, NGOs and donors</text>
  <circle cx="720" cy="896" r="4" class="bullet"/><text x="732" y="900" class="body">Sponsored regional monitoring, research grants and philanthropy</text>

  <text x="38" y="969" class="footer">Lumen · Evidence-grounded crisis ranking, explainable scoring and automated outreach</text>
  <text x="1362" y="969" text-anchor="end" class="footer">Live prototype: lumen.64-227-166-157.sslip.io</text>
</svg>
